packages:
  - tests/runtime-consumer

# pnpm applies a minimum release age before it will install a package. These exempt exact
# versions so a same-day publish can be consumed. Scoped to single versions on purpose: this
# must NOT become a standing bypass of that supply-chain control. Each entry is dead weight
# once its version is older than the minimum release age.
minimumReleaseAgeExclude:
  - '@tangle-network/agent-interface@2.13.1'
  - '@tangle-network/agent-eval@0.200.1'
  - '@tangle-network/agent-runtime@0.283.0'
  - '@tangle-network/sandbox@0.55.3'
  - '@tangle-network/agent-knowledge@17.1.10'

# Dependencies allowed to run install scripts. better-sqlite3 needs its install script to
# obtain the native binding the session store loads; esbuild needs its platform binary.
allowBuilds:
  better-sqlite3: true
  esbuild: true
