packages:
  - tests/runtime-consumer

# pnpm applies a minimum release age before it will install a package. These exempt exact
# versions so a same-day publish can be consumed. Scoped to single versions on purpose: this
# must NOT become a standing bypass of that supply-chain control. Each entry is dead weight
# once its version is older than the minimum release age.
minimumReleaseAgeExclude:
  - '@hono/node-server@2.1.5'
  - '@openai/codex@0.164.0'
  - '@tangle-network/agent-interface@5.10.2'
  - '@tangle-network/agent-profile-materialize@1.1.1 || 1.1.4'
  - '@tangle-network/agent-runtime@1.0.0'
  - '@tangle-network/sandbox@1.0.23'
  - '@tangle-network/agent-eval@1.0.0'
  - '@tangle-network/agent-trace-contract@2.1.0 || 2.2.0'
  - '@types/better-sqlite3@9.6.0'
  - '@types/node@26.6.5'
  - 'better-sqlite3@13.0.3'
  - 'hono@4.13.14'
  - 'tsx@4.23.15'
  - 'typescript@7.0.2'
  - 'vitest@5.0.5'
  - 'zod@4.6.7'
  - '@tangle-network/agent-core@1.0.0'
  - '@tangle-network/agent-knowledge@23.0.0'
  - '@tangle-network/harness-sessions@1.0.1'
  - '@tangle-network/hub-sdk@1.0.5'

# Dependencies allowed to run install scripts. better-sqlite3 needs its install script to
# obtain the native binding the session store loads; esbuild needs its platform binary.
allowBuilds:
  better-sqlite3: true
  esbuild: true

overrides:
  '@tangle-network/agent-interface': 5.10.2
  zod: 4.6.7
