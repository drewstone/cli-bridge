name: Local live inference

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-inference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  opencode:
    # Live inference is explicit, same-repository, owner-authored only. Never a merge gate.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       contains(github.event.pull_request.labels.*.name, 'live-inference'))
    runs-on: [self-hosted, beelink]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Temporary qualification step: its generated manifest/lockfile must be
      # committed before this PR is ready; then normal frozen installation owns it.
      - name: Qualify released Runtime 0.325.0
        run: pnpm --filter cli-bridge-runtime-consumer-regression add --save-dev --save-exact @tangle-network/agent-runtime@0.325.0
      - name: Retain exact resolved dependency files
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dependency-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pnpm-lock.yaml
            tests/runtime-consumer/package.json
          retention-days: 14
      - name: Install pinned OpenCode into this job only
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          tool="$RUNNER_TEMP/opencode-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$tool"
          mkdir -m 700 "$tool/bin"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/anomalyco/opencode/releases/download/v1.19.3/opencode-linux-x64-baseline.tar.gz \
            --output "$tool/opencode.tar.gz"
          printf '%s  %s\n' 531cff2441129c30f0edd5878af494108ad07f5feb46d7ee29a2a5b830a5765d "$tool/opencode.tar.gz" | sha256sum --check --status
          tar --extract --gzip --no-same-owner --file "$tool/opencode.tar.gz" --directory "$tool/bin"
          test -x "$tool/bin/opencode"
          mv "$tool/bin/opencode" "$tool/bin/opencode-native"
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/opencode-native" --print-logs --log-level DEBUG "$@"' > "$tool/bin/opencode"
          chmod 700 "$tool/bin/opencode"
          echo "OPENCODE_BIN=$tool/bin/opencode" >> "$GITHUB_ENV"
      - name: Real Runtime, local bridge, OpenCode, and GLM Flash
        run: pnpm test:local-inference
        env:
          CLI_BRIDGE_REAL_OPENCODE_TESTS: '1'
          CLI_BRIDGE_LIVE_MODEL: opencode/glm-5.3-flash-free
          CLI_BRIDGE_LIVE_OUT: ${{ runner.temp }}/cli-bridge-live-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain the actual execution receipt (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-inference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-bridge-live-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
