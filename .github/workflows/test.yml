name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm that package.json `packageManager` pins.
      - uses: pnpm/action-setup@v6.1.0

      # engines.node declares >=22; test on the declared floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Real-docker and real-cgroup suites are opt-in via
      # CLI_BRIDGE_REAL_DOCKER_TESTS / CLI_BRIDGE_REAL_CGROUP_TESTS and
      # self-skip here; everything else runs.
      - name: Test
        run: pnpm test
