name: Finalize local proof
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  qualify:
    if: github.event.pull_request.number == 263 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'drewstone' && github.event.pull_request.head.ref == 'test/local-opencode-runtime-proof'
    runs-on: [self-hosted, beelink]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Reapply the exact source corrections already qualified in run 39087429976
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', 'c7f51eeaac0a33eddb1399ae2dfca1868f4cd976:.github/workflows/finalize-local-proof.yml'], text=True)
          body = source.split("          python3 <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0]
          exec(compile(textwrap.dedent(body), 'qualified-source-corrections', 'exec'))
          PY
          git diff --check
          node --check tests/runtime-consumer/live-opencode.mjs
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Required affected-path checks
        run: pnpm typecheck && pnpm test:runtime-consumer && pnpm exec vitest run tests/trace-emitter.test.ts tests/trace-contract-lock.test.ts tests/prompt-intent.test.ts tests/opencode-profile-isolation.test.ts tests/jail-resolver.test.ts tests/opencode-jail-binary.test.ts
        env:
          CLI_BRIDGE_REAL_OPENCODE_TESTS: '1'
      - name: Publish only qualified source to the existing feature branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=test/local-opencode-runtime-proof
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name drewstone
          git config user.email drewstone329@gmail.com
          git add package.json src/trace/contract-build.ts tests/prompt-intent.test.ts tests/runtime-consumer/live-opencode.mjs tests/trace-contract-lock.test.ts
          git commit -m 'fix: qualify local bridge proof and scope trace provenance to its producer'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
