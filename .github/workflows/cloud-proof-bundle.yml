name: Cloud proof bundle
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: read
concurrency:
  group: cloud-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  bundle:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      contains(github.event.pull_request.labels.*.name, 'cloud-proof')
    runs-on: [self-hosted, beelink]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Package only tracked code and installed public dependencies
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/cloud-proof-$GITHUB_RUN_ID"
          mkdir -p "$bundle/repo" "$bundle/bin"
          git archive HEAD | tar -x -C "$bundle/repo"
          git rev-parse HEAD > "$bundle/commit.txt"
          cp "$(command -v node)" "$bundle/bin/node"
          cp -a node_modules "$bundle/repo/node_modules"
          cp -a tests/runtime-consumer/node_modules "$bundle/repo/tests/runtime-consumer/node_modules"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/anomalyco/opencode/releases/download/v1.19.3/opencode-linux-x64-baseline.tar.gz \
            --output "$bundle/opencode.tar.gz"
          printf '%s  %s\n' 531cff2441129c30f0edd5878af494108ad07f5feb46d7ee29a2a5b830a5765d "$bundle/opencode.tar.gz" | sha256sum --check --status
          tar -xzf "$bundle/opencode.tar.gz" -C "$bundle/bin"
          rm "$bundle/opencode.tar.gz"
          tar -czf "$RUNNER_TEMP/cloud-proof-bundle.tar.gz" -C "$bundle" .
          sha256sum "$RUNNER_TEMP/cloud-proof-bundle.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-proof-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/cloud-proof-bundle.tar.gz
          retention-days: 2
          compression-level: 0
      - name: Full repository checks
        run: pnpm typecheck && pnpm test
