name: Finish local proof
on:
  push:
    branches: [test/local-opencode-runtime-proof]
    paths: [.github/workflows/finish-local-proof.yml]
permissions:
  contents: write
concurrency:
  group: finish-local-proof-263
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'drewstone/cli-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Integrate current main without discarding peer changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name drewstone
          git config user.email drewstone329@gmail.com
          git merge --no-edit origin/main
      - name: Apply the locally executed fixture fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/pi-native.test.ts')
          s = p.read_text()
          old = '    const source = isRpc ? childSource : \'print("pi 0.83.0-test", flush=True)\''
          new = r'''    // The short RPC deadline tests missing acknowledgements, not Python startup.
              // Signal readiness on stderr so no protocol response is consumed here.
              const source = isRpc
                ? childSource.replace('for line in sys.stdin:', 'print("bridge-fixture-ready", file=sys.stderr, flush=True)\nfor line in sys.stdin:')
                : 'print("pi 0.83.0-test", flush=True)' '''.rstrip()
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = "    const closed = new Promise<void>(resolve => child.once('close', () => resolve()))\n    return {"
          new = r'''    const closed = new Promise<void>(resolve => child.once('close', () => resolve()))
              if (isRpc) {
                await new Promise<void>((resolve, reject) => {
                  let stderr = ''
                  const cleanup = () => {
                    clearTimeout(timer)
                    child.stderr?.off('data', onData)
                    child.off('error', onError)
                    child.off('close', onClose)
                  }
                  const onError = (error: Error) => { cleanup(); reject(error) }
                  const onClose = () => onError(new Error(`Pi fixture exited before readiness: ${stderr}`))
                  const onData = (chunk: Buffer) => {
                    stderr = (stderr + chunk.toString()).slice(-8192)
                    if (stderr.includes('bridge-fixture-ready\n')) { cleanup(); resolve() }
                  }
                  const timer = setTimeout(() => {
                    child.kill('SIGKILL')
                    onError(new Error(`Pi fixture did not initialize: ${stderr}`))
                  }, 5_000)
                  child.stderr?.on('data', onData)
                  child.once('error', onError)
                  child.once('close', onClose)
                })
              }
              return {'''
          assert s.count(old) == 2
          s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('tests/executor-saturation.test.ts')
          s = p.read_text()
          old = "  it.skipIf(process.platform === 'win32')('holds the slot after leader exit while its helper survives', async () => {\n"
          assert s.count(old) == 1
          s = s.replace(old, old + "    // This checks process lifetime, not the 400ms admission cap tested above.\n    process.env.BRIDGE_HOST_MAX_ACQUIRE_DEADLINE_MS = '5000'\n")
          start = s.index(old)
          end = s.index('\n  })', start)
          s = s[:start] + s[start:end].replace('acquireDeadlineMs: 400,', 'acquireDeadlineMs: 5_000,') + s[end:]
          p.write_text(s)
          PY
          git diff --check
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm typecheck
      - name: Repeat the timeout regressions without weakening their assertions
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do pnpm exec vitest run tests/pi-native.test.ts tests/executor-saturation.test.ts; done
      - name: Complete repository suite and actual published Runtime consumer
        run: pnpm test
      - name: Publish only the verified corrections
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=test/local-opencode-runtime-proof
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git add tests/pi-native.test.ts tests/executor-saturation.test.ts
          git commit -m 'test: separate native fixture readiness from protocol deadlines'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
